<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 350" width="490" height="350">
<style>
  .card-bg { fill: #0d1117; rx: 10px; ry: 10px; }
  .card-border { fill: none; stroke: #30363d; stroke-width: 1; rx: 10px; ry: 10px; }
  .top-bar { fill: #161b22; rx: 10px; ry: 10px; }
  .dot-red { fill: #ff5f56; }
  .dot-yellow { fill: #ffbd2e; }
  .dot-green { fill: #27c93f; }
  .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; font-weight: 600; }
  .key-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; font-weight: bold; fill: #58a6ff; }
  .val-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #c9d1d9; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animated-row { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
</style>
<rect width="490" height="350" class="card-bg" />
<rect width="490" height="32" class="top-bar" />
